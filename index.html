<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ether - Voice Email Agent</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#0f172a; color:#e2e8f0; display:flex; flex-direction:column; align-items:center; min-height:100vh; }
  h1 { margin-top:32px; font-weight:600; }
  #orb { width:220px; height:220px; border-radius:50%; margin:32px 0 16px; background: radial-gradient(circle at 30% 30%, #67e8f9, #2563eb 60%, #1e3a8a); box-shadow:0 0 40px #2563eb88; cursor:pointer; border:none; transition: transform .2s; }
  #orb.listening { animation: pulse 1s infinite; }
  #orb.thinking { animation: spin 1.5s linear infinite; }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.08); } }
  @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
  #status { font-size:18px; margin-bottom:24px; }
  .box { width:90%; max-width:560px; background:#1e293b; border-radius:12px; padding:14px 18px; margin:8px 0; }
  .label { font-size:12px; color:#94a3b8; text-transform:uppercase; margin-bottom:6px; }
  details { width:90%; max-width:560px; margin:24px 0; color:#94a3b8; }
  input { width:100%; box-sizing:border-box; padding:8px; margin:6px 0 12px; border-radius:6px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; }
  button.save { padding:8px 16px; border-radius:6px; border:none; background:#2563eb; color:white; cursor:pointer; }
</style>
</head>
<body>
  <h1>Ether - Voice Email Agent</h1>
  <button id="orb" title="Tap and speak"></button>
  <div id="status">Tap the circle and speak</div>
  <div class="box"><div class="label">You said</div><div id="you">-</div></div>
  <div class="box"><div class="label">Ether replied</div><div id="reply">-</div></div>
  <details id="settings">
    <summary>Settings (enter once)</summary>
    <p>Enter the Name and Value from your n8n "Header Auth account" credential. They are stored only in this browser.</p>
    <label>Header name</label><input id="hname" placeholder="e.g. Authorization">
    <label>Header value</label><input id="hvalue" type="password">
    <button class="save" id="save">Save</button>
  </details>
<script>
  var AGENT_URL = "https://ing-2456.app.n8n.cloud/webhook/a850824f-0e56-4f79-91c8-a00a83875fef";
  var mem = {};
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } } };
  var SESSION_ID = "voice-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
  var orb = document.getElementById("orb");
  var statusEl = document.getElementById("status");
  var youEl = document.getElementById("you");
  var replyEl = document.getElementById("reply");
  var hname = document.getElementById("hname");
  var hvalue = document.getElementById("hvalue");
  hname.value = store.get("ether_hname") || "";
  hvalue.value = store.get("ether_hvalue") || "";
  if (!hname.value || !hvalue.value) { document.getElementById("settings").open = true; }
  document.getElementById("save").onclick = function () {
    store.set("ether_hname", hname.value.trim());
    store.set("ether_hvalue", hvalue.value);
    statusEl.textContent = "Settings saved. Tap the circle and speak";
  };

  function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-IN";
    window.speechSynthesis.speak(u);
  }

  function sendToAgent(text) {
    var headers = { "Content-Type": "application/json" };
    var n = store.get("ether_hname");
    var v = store.get("ether_hvalue");
    if (n && v) { headers[n] = v; }
    orb.className = "thinking";
    statusEl.textContent = "Working on it...";
    fetch(AGENT_URL, { method: "POST", headers: headers, body: JSON.stringify({ text: text, sessionId: SESSION_ID }) })
      .then(function (r) {
        if (r.status === 403 || r.status === 401) { throw new Error("Auth failed - check the header name and value in Settings."); }
        if (r.status === 404) { throw new Error("Agent workflow not found - it must be published."); }
        if (!r.ok) { throw new Error("Agent error (HTTP " + r.status + ")."); }
        return r.json();
      })
      .then(function (data) {
        var msg = (data && data.response) ? data.response : JSON.stringify(data);
        replyEl.textContent = msg;
        statusEl.textContent = "Tap the circle to speak again";
        speak(msg);
      })
      .catch(function (e) {
        replyEl.textContent = e.message;
        statusEl.textContent = "Something went wrong";
        speak(e.message);
      })
      .finally(function () { orb.className = ""; });
  }

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  orb.onclick = function () {
    if (!SR) { statusEl.textContent = "Voice input needs Google Chrome or Microsoft Edge."; return; }
    var rec = new SR();
    rec.lang = "en-IN";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    orb.className = "listening";
    statusEl.textContent = "Listening...";
    rec.onresult = function (ev) {
      var text = ev.results[0][0].transcript;
      youEl.textContent = text;
      sendToAgent(text);
    };
    rec.onerror = function (ev) {
      orb.className = "";
      statusEl.textContent = "Mic error: " + ev.error + ". Allow microphone access and try again.";
    };
    rec.onend = function () { if (orb.className === "listening") { orb.className = ""; statusEl.textContent = "Tap the circle and speak"; } };
    rec.start();
  };
</script>
</body>
</html>
